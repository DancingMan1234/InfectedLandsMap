<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Map</title>

  <!-- Leaflet: the map library (loaded from the internet) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    /* COLORS restyle the whole site */
    :root {
      --background: #14171c;
      --panel:      #1b1f27;
      --panel-light:#232833;
      --text:       #e7eaf0;
      --text-dim:   #8b93a3;
      --accent:     #5b9dff;
      --border:     #2d3340;
    }

    /* PAGE LAYOUT: sidebar on the left, map on the right */
    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    #app { display: flex; height: 100%; }

    button {
      font: inherit;
      cursor: pointer;
      color: var(--text);
      background: var(--panel-light);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
    }
    button:hover { border-color: var(--accent); }

    /* SIDEBAR */
    #sidebar {
      width: 320px;
      flex: none;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--border);
      z-index: 1000;
      transition: transform 0.2s;
    }

    #sidebar header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    #sidebar h1 {
      margin: 0 0 2px;
      font-size: 18px;
    }

    .subtitle {
      font-size: 12px;
      color:var(--text-dim)
    }

    #search {
      width: 100%;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-light);
      color: var(--text);
      outline: none;
    }
    #search:focus { border-color: var(--accent); }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    /* The scrolling list of category filters */
    #filters {
      flex: 1;
      overflow-y: auto;
      padding: 8px 8px 24px;
    }

    .group-title {
      margin: 14px 8px 6px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .category-button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-bottom: 4px;
      padding: 8px 10px;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
    }
    .category-button:hover { background: var(--panel-light); }
    .category-button.is-hidden { opacity: 0.4; }

    .category-icon {
      flex: none;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      font-size: 14px;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 1px 4px #0008;
    }

    .category-name  { flex: 1; }
    .category-count { color: var(--text-dim); font-size: 12px; }

    /* MAP AREA*/
    #map-area {
      flex: 1;
      position: relative;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #0e1014;
    }

    .leaflet-container { font: inherit; }

    /* The round pins on the map */
    .marker-pin {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      font-size: 15px;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 2px 6px #000a;
      transition: transform 0.1s;
    }
    .marker-pin:hover { transform: scale(1.2); }

    /* Popup shown when you click a pin */
    .leaflet-popup-content-wrapper {
      background: var(--panel);
      color: var(--text);
      border-radius: 12px;
    }
    .leaflet-popup-tip { background: var(--panel); }

    .popup h3 { margin: 0 0 2px; font-size: 15px; }
    .popup-type {
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .popup img {
      max-width: 100%;
      margin: 6px 0;
      border-radius: 8px;
    }
    .popup-coords {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-dim);
    }

    /* Live x / z readout in the bottom-left corner */
    #coords-readout {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 900;
      padding: 4px 8px;
      font-size: 12px;
      color: #cbd5e1;
      background: #000a;
      border-radius: 6px;
      pointer-events: none;
    }

    /* "Filters" button, only visible on phones */
    #menu-button {
      display: none;
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1100;
    }

    /* EDIT MODE PANEL (only shown with ?edit=1 in the address) */
    #edit-panel {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1100;
      width: 300px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    #edit-panel select,
    #edit-panel input,
    #edit-panel textarea {
      width: 100%;
      margin-bottom: 6px;
      padding: 7px;
      font: inherit;
      color: var(--text);
      background: var(--panel-light);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    #edit-output {
      height: 120px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
    }

    /* PHONE LAYOUT: sidebar slides in over the map */
    @media (max-width: 760px) {
      #sidebar {
        position: absolute;
        inset: 0 auto 0 0;
        width: 85%;
        max-width: 340px;
        transform: translateX(-100%);
      }
      #sidebar.is-open { transform: none; }
      #menu-button { display: block; }
    }
  </style>
</head>

<body>
  <div id="app">

    <!-- Sidebar: search + category filters  -->
    <aside id="sidebar">
      <header>
        <h1 id="title">Map</h1>
        <div id="creator" class="subtitle">author</div>
        <div id="version" class="subtitle">gameVersion</div>
        <input id="search" type="search" placeholder="Search markers…" autocomplete="off">
        <div class="button-row">
          <button id="show-all">Show all</button>
          <button id="hide-all">Hide all</button>
        </div>
      </header>

      <!-- Category buttons are added here by the script below -->
      <div id="filters"></div>
    </aside>

    <!--  Map  -->
    <div id="map-area">
      <button id="menu-button">☰ Filters</button>
      <div id="map"></div>
      <div id="coords-readout">x: –, z: –</div>

      <!-- ?edit=1 -->
      <div id="edit-panel">
        <strong>Edit mode</strong>
        <span style="color: var(--text-dim)">— click the map to place a marker</span>

        <select id="edit-type"></select>
        <input id="edit-name" placeholder="Name">
        <input id="edit-desc" placeholder="Description">
        <textarea id="edit-output" readonly
                  placeholder="Placed markers appear here. Paste them into data.js"></textarea>

        <div class="button-row">
          <button id="edit-copy">Copy</button>
          <button id="edit-clear">Clear</button>
        </div>
      </div>
    </div>

  </div>

  
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>

  <script>
  (() => {

   
    // SETTINGS (loaded from data.js)
   
    const config     = window.MAP_CONFIG;
    const categories = window.MAP_CATEGORIES;
    const markers    = window.MAP_MARKERS;

    const imageWidth  = config.imageWidth;
    const imageHeight = config.imageHeight;
    const world       = config.world;

    // Edit mode is on when the address ends in ?edit=1
    const editModeOn = new URLSearchParams(location.search).has("edit");

    // Quick lookup: category id -> category
    const categoryById = Object.fromEntries(categories.map(c => [c.id, c]));

    // What the visitor currently has selected
    let visibleCategoryIds = new Set(categories.map(c => c.id));
    let searchText = "";

    document.title = config.title;
    document.getElementById("title").textContent = config.title;
    document.getElementById("creator").textContent = config.creator ? "Creator: " + config.creator : "";
    document.getElementById("version").textContent = config.version ? "Game version " + config.version : "";


  
    //  MAP COORDINATE CONVERSIONS
    

    // Game coordinates (studs) -> position on the map image
    function worldToMap(x, z) {
      const lat = imageHeight - ((z - world.minZ) / (world.maxZ - world.minZ)) * imageHeight;
      const lng = ((x - world.minX) / (world.maxX - world.minX)) * imageWidth;
      return [lat, lng];
    }

    // Position on the map image -> game coordinates (studs)
    function mapToWorld(latlng) {
      return {
        x: Math.round(world.minX + (latlng.lng / imageWidth) * (world.maxX - world.minX)),
        z: Math.round(world.minZ + ((imageHeight - latlng.lat) / imageHeight) * (world.maxZ - world.minZ)),
      };
    }

    // Makes text safe to put inside HTML
    function escapeHtml(text) {
      const replacements = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
      return String(text ?? "").replace(/[&<>"']/g, char => replacements[char]);
    }


    
    // MAP SETUP
    
    const imageBounds = [[0, 0], [imageHeight, imageWidth]];

    const map = L.map("map", {
      crs: L.CRS.Simple,              // flat image map, not a real-world map
      minZoom: config.minZoom,
      maxZoom: config.maxZoom,
      zoomSnap: 0.25,
      maxBounds: [[-imageHeight * 0.25, -imageWidth * 0.25],
                  [ imageHeight * 1.25,  imageWidth * 1.25]],
      maxBoundsViscosity: 0.8,
      attributionControl: false,
    });

    L.imageOverlay(config.image, imageBounds).addTo(map);
    map.fitBounds(imageBounds);

    // Show the game coordinates under the mouse
    map.on("mousemove", event => {
      const position = mapToWorld(event.latlng);
      document.getElementById("coords-readout").textContent =
        `x: ${position.x}, z: ${position.z}`;
    });


   
    // MARKERS
    
    const markerLayer = L.layerGroup().addTo(map);   // markers currently shown
    const leafletMarkers = new Map();                // marker id -> { leafletMarker, data }

    // The round emoji pin
    function makeIcon(markerData) {
      const category = categoryById[markerData.type] || { icon: "❓", color: "#888" };
      return L.divIcon({
        className: "",
        html: `<div class="marker-pin" style="background:${category.color}">${category.icon}</div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -16],
      });
    }

    // The popup that opens when a pin is clicked
    function makePopupHtml(markerData) {
      const category = categoryById[markerData.type] || { name: markerData.type };
      return `
        <div class="popup">
          <h3>${escapeHtml(markerData.name || category.name)}</h3>
          <div class="popup-type">${escapeHtml(category.name)}</div>
          ${markerData.image ? `<img src="${escapeHtml(markerData.image)}" alt="">` : ""}
          ${markerData.desc ? `<div>${escapeHtml(markerData.desc)}</div>` : ""}
          <div class="popup-coords">x: ${markerData.x}, z: ${markerData.z}</div>
        </div>`;
    }

    // Create one Leaflet marker for every entry in data.js
    function createAllMarkers() {
      markers.forEach(markerData => {
        const leafletMarker = L.marker(worldToMap(markerData.x, markerData.z), {
          icon: makeIcon(markerData),
          title: markerData.name,
        });

        leafletMarker.bindPopup(() => makePopupHtml(markerData), { minWidth: 200 });

        // Put the marker id in the address so the link can be shared (e.g. index.html#c1)
        leafletMarker.on("popupopen", () => {
          history.replaceState(null, "", "#" + markerData.id);
        });

        leafletMarkers.set(markerData.id, { leafletMarker, data: markerData });
      });
    }

    // Does this marker match the search box?
    function matchesSearch(markerData) {
      const search = searchText.trim().toLowerCase();
      if (!search) return true;

      const category = categoryById[markerData.type];
      const searchableText = [
        markerData.name,
        markerData.desc,
        category && category.name,
      ].join(" ").toLowerCase();

      return searchableText.includes(search);
    }

    // Show only the markers whose category is on AND that match the search
    function updateVisibleMarkers() {
      markerLayer.clearLayers();

      leafletMarkers.forEach(({ leafletMarker, data }) => {
        const categoryIsOn = visibleCategoryIds.has(data.type);
        if (categoryIsOn && matchesSearch(data)) {
          markerLayer.addLayer(leafletMarker);
        }
      });
    }


    
    // SIDEBAR (category filter buttons)
    
    const filtersElement = document.getElementById("filters");
    const categoryButtons = {};   // category id -> its button

    function buildSidebar() {
      const groupNames = [...new Set(categories.map(c => c.group))];

      groupNames.forEach(groupName => {
        // Group heading, e.g. "CHESTS"
        const heading = document.createElement("div");
        heading.className = "group-title";
        heading.textContent = groupName;
        filtersElement.appendChild(heading);

        // One button per category in this group
        categories
          .filter(category => category.group === groupName)
          .forEach(category => {
            const count = markers.filter(m => m.type === category.id).length;

            const button = document.createElement("button");
            button.className = "category-button";
            button.innerHTML = `
              <span class="category-icon" style="background:${category.color}">${category.icon}</span>
              <span class="category-name">${escapeHtml(category.name)}</span>
              <span class="category-count">${count}</span>`;

            button.onclick = () => toggleCategory(category.id);

            filtersElement.appendChild(button);
            categoryButtons[category.id] = button;
          });
      });
    }

    function toggleCategory(categoryId) {
      if (visibleCategoryIds.has(categoryId)) {
        visibleCategoryIds.delete(categoryId);
      } else {
        visibleCategoryIds.add(categoryId);
      }
      categoryButtons[categoryId].classList.toggle("is-hidden", !visibleCategoryIds.has(categoryId));
      updateVisibleMarkers();
    }

    function setAllCategories(turnOn) {
      visibleCategoryIds = new Set(turnOn ? categories.map(c => c.id) : []);
      Object.values(categoryButtons).forEach(button => {
        button.classList.toggle("is-hidden", !turnOn);
      });
      updateVisibleMarkers();
    }

    // Sidebar controls
    document.getElementById("show-all").onclick = () => setAllCategories(true);
    document.getElementById("hide-all").onclick = () => setAllCategories(false);

    document.getElementById("search").oninput = event => {
      searchText = event.target.value;
      updateVisibleMarkers();
    };

    // Phone: open / close the sidebar
    const sidebar = document.getElementById("sidebar");
    document.getElementById("menu-button").onclick = () => sidebar.classList.toggle("is-open");
    map.on("click", () => sidebar.classList.remove("is-open"));


    
    // SHARE LINKS: index.html#c1 opens marker "c1"
    
    function openMarkerFromAddress() {
      const markerId = location.hash.slice(1);
      const entry = leafletMarkers.get(markerId);
      if (!entry) return;

      // Make sure its category is switched on so the marker is visible
      visibleCategoryIds.add(entry.data.type);
      categoryButtons[entry.data.type].classList.remove("is-hidden");
      updateVisibleMarkers();

      map.setView(entry.leafletMarker.getLatLng(), Math.max(map.getZoom(), 0));
      entry.leafletMarker.openPopup();
    }

    window.addEventListener("hashchange", openMarkerFromAddress);


    
    //    EDIT MODE (only runs when the address ends in ?edit=1)
    //    click the map -> a marker entry appears in the text box
    //    -> copy it into data.js
    
    function startEditMode() {
      const panel      = document.getElementById("edit-panel");
      const typeSelect = document.getElementById("edit-type");
      const nameInput  = document.getElementById("edit-name");
      const descInput  = document.getElementById("edit-desc");
      const output     = document.getElementById("edit-output");
      let placedMarkers = [];

      panel.style.display = "block";

      categories.forEach(category => {
        typeSelect.add(new Option(`${category.group} – ${category.name}`, category.id));
      });

      map.on("click", event => {
        const position = mapToWorld(event.latlng);
        const type = typeSelect.value;

        const newMarker = {
          id: type.split("_")[0] + "_" + Date.now().toString(36),
          type: type,
          name: nameInput.value || categoryById[type].name,
          x: position.x,
          z: position.z,
          desc: descInput.value,
        };

        placedMarkers.push(newMarker);
        L.marker(event.latlng, { icon: makeIcon(newMarker) }).addTo(map);

        output.value = placedMarkers
          .map(marker => "  " + JSON.stringify(marker) + ",")
          .join("\n");
      });

      document.getElementById("edit-copy").onclick = () => {
        output.select();
        document.execCommand("copy");
      };

      document.getElementById("edit-clear").onclick = () => {
        placedMarkers = [];
        output.value = "";
      };
    }


   
    //  EXECUTION ORDER:
    
    buildSidebar();
    createAllMarkers();
    updateVisibleMarkers();

    if (editModeOn) startEditMode();
    if (location.hash) openMarkerFromAddress();

  })();
  </script>
</body>
</html>
